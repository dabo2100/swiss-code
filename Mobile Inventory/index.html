<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <h1 class="bg-primary py-3 text-center">T-Tech Store</h1>
    <div class="container">
      <div class="d-flex gap-3 align-items-center mb-3">
        <button class="btn btn-primary" onclick="renderPhones()">
          Show Phones
        </button>
        <button
          class="btn btn-success"
          data-bs-toggle="modal"
          data-bs-target="#newPhoneModal"
        >
          Add New Phone
        </button>
      </div>
      <table class="table table-dark">
        <thead>
          <tr>
            <th>#</th>
            <th>Phone Name</th>
            <th>Phone Price</th>
            <th>Phone Qty</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Add New Phone Modal -->
    <!-- Modal -->
    <div
      class="modal fade"
      id="newPhoneModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Add New Phone
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body d-flex flex-column gap-3">
            <input
              id="phoneInputName"
              class="form-control"
              type="text"
              placeholder="Enter new Phone Name"
            />
            <input
              id="phoneInputPrice"
              class="form-control"
              type="number"
              placeholder="Enter new Phone Price"
            />
            <input
              id="phoneInputQty"
              class="form-control"
              type="number"
              placeholder="Enter new Phone Qty"
            />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="addNewPhone()"
              data-bs-dismiss="modal"
            >
              Save changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
